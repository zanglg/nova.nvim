# Generated by scripts/generate_themes.lua; do not edit.
# Nova Light Soft — tmux 3.7+

# Status bar: normal.a = ends, normal.b = current window, normal.c = rest.
set -g status-style "bg=#cdced0,fg=#414348"
set -g status-left-style none
set -g status-right-style none
set -g status-left "#[fg=#cdced0,bg=#416b9b,bold] #S #[fg=#416b9b,bg=#cdced0,nobold]"
set -g status-right "#[fg=#416b9b,bg=#cdced0,nobold]#[fg=#cdced0,bg=#416b9b,bold] %Y-%m-%d %H:%M "
setw -g window-status-style "fg=#414348,bg=#cdced0,none"
setw -g window-status-current-style "fg=#416b9b,bg=#e5e5e6,none"
setw -g window-status-separator " "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#cdced0,bg=#e5e5e6] #[fg=#416b9b]#I #W #[fg=#e5e5e6,bg=#cdced0]"

# Messages, selection, search, and navigation.
set -g message-style "fg=#414348,bg=#dadbdc,fill=#dadbdc"
set -g message-command-style "fg=#414348,bg=#dadbdc,fill=#dadbdc"
setw -g mode-style "fg=#414348,bg=#cdced0"
setw -g copy-mode-match-style "fg=#efeff0,bg=#5d6841"
setw -g copy-mode-current-match-style "fg=#efeff0,bg=#7f6548"
setw -g copy-mode-mark-style "fg=#efeff0,bg=#476b71"

# Synchronize-panes takes priority over copy mode: red / yellow / blue.
setw -g pane-border-style "fg=#c0c1c4"
setw -g pane-active-border-style "#{?synchronize-panes,fg=#a35461,#{?pane_in_mode,fg=#a1905e,fg=#416b9b}}"
set -g display-panes-colour "#9a9ca2"
set -g display-panes-active-colour "#416b9b"

# Menus and popups.
set -g menu-style "fg=#414348,bg=#dadbdc"
set -g menu-selected-style "fg=#416b9b,bg=#cdced0"
set -g menu-border-style "fg=#c0c1c4,bg=#dadbdc"
set -g popup-style "fg=#414348,bg=#dadbdc"
set -g popup-border-style "fg=#c0c1c4,bg=#dadbdc"
