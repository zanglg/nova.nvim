# Generated by scripts/generate_themes.lua; do not edit.
# Nova Dark — tmux 3.7+

# Status bar: normal.a = ends, normal.b = current window, normal.c = rest.
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#2d354e,fg=#b6bac9"
set -g status-left-style none
set -g status-right-style none
set -g status-left-length 16
set -g status-right-length 32
set -g status-left "#[fg=#2d354e,bg=#5e8eed,bold] #S #[fg=#5e8eed,bg=#2d354e,nobold]"
set -g status-right "#[fg=#5e8eed,bg=#2d354e,nobold]#[fg=#2d354e,bg=#5e8eed,bold] %Y-%m-%d %H:%M "
setw -g window-status-style "fg=#b6bac9,bg=#2d354e,none"
setw -g window-status-current-style "fg=#5e8eed,bg=#22283a,none"
setw -g window-status-separator " "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#2d354e,bg=#22283a] #[fg=#5e8eed]#I #W #[fg=#22283a,bg=#2d354e]"

# Messages, selection, search, and navigation.
set -g message-style "fg=#b6bac9,bg=#272e44,fill=#272e44"
set -g message-command-style "fg=#b6bac9,bg=#272e44,fill=#272e44"
setw -g mode-style "fg=#b6bac9,bg=#2d354e"
setw -g copy-mode-match-style "fg=#1c2131,bg=#afcf59"
setw -g copy-mode-current-match-style "fg=#1c2131,bg=#d49d5e"
setw -g copy-mode-mark-style "fg=#1c2131,bg=#66becc"

# Synchronize-panes takes priority over copy mode: red / yellow / blue.
setw -g pane-border-style "fg=#323c57"
setw -g pane-active-border-style "#{?synchronize-panes,fg=#dc6583,#{?pane_in_mode,fg=#d6a75c,fg=#5e8eed}}"
set -g display-panes-colour "#6c7693"
set -g display-panes-active-colour "#5e8eed"

# Menus and popups.
set -g menu-style "fg=#b6bac9,bg=#272e44"
set -g menu-selected-style "fg=#5e8eed,bg=#2d354e"
set -g menu-border-style "fg=#323c57,bg=#272e44"
set -g popup-style "fg=#b6bac9,bg=#272e44"
set -g popup-border-style "fg=#323c57,bg=#272e44"
