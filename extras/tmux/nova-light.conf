# Generated by scripts/generate_themes.lua; do not edit.
# Nova Light — tmux 3.7+

# Status bar: normal.a = ends, normal.b = current window, normal.c = rest.
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#d9d9d9,fg=#383a42"
set -g status-left-style none
set -g status-right-style none
set -g status-left-length 16
set -g status-right-length 32
set -g status-left "#[fg=#d9d9d9,bg=#1565c1,bold] #S #[fg=#1565c1,bg=#d9d9d9,nobold]"
set -g status-right "#[fg=#1565c1,bg=#d9d9d9,nobold]#[fg=#d9d9d9,bg=#1565c1,bold] %Y-%m-%d %H:%M "
setw -g window-status-style "fg=#383a42,bg=#d9d9d9,none"
setw -g window-status-current-style "fg=#1565c1,bg=#f2f2f2,none"
setw -g window-status-separator " "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#d9d9d9,bg=#f2f2f2] #[fg=#1565c1]#I #W #[fg=#f2f2f2,bg=#d9d9d9]"

# Messages, selection, search, and navigation.
set -g message-style "fg=#383a42,bg=#e6e6e6,fill=#e6e6e6"
set -g message-command-style "fg=#383a42,bg=#e6e6e6,fill=#e6e6e6"
setw -g mode-style "fg=#383a42,bg=#d9d9d9"
setw -g copy-mode-match-style "fg=#fafafa,bg=#576d1d"
setw -g copy-mode-current-match-style "fg=#fafafa,bg=#915d22"
setw -g copy-mode-mark-style "fg=#fafafa,bg=#1d6f7c"

# Synchronize-panes takes priority over copy mode: red / yellow / blue.
setw -g pane-border-style "fg=#cccccc"
setw -g pane-active-border-style "#{?synchronize-panes,fg=#c72943,#{?pane_in_mode,fg=#b38c19,fg=#1565c1}}"
set -g display-panes-colour "#909198"
set -g display-panes-active-colour "#1565c1"

# Menus and popups.
set -g menu-style "fg=#383a42,bg=#e6e6e6"
set -g menu-selected-style "fg=#1565c1,bg=#d9d9d9"
set -g menu-border-style "fg=#cccccc,bg=#e6e6e6"
set -g popup-style "fg=#383a42,bg=#e6e6e6"
set -g popup-border-style "fg=#cccccc,bg=#e6e6e6"
