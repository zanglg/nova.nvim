# Generated by scripts/generate_themes.lua; do not edit.
# Nova Dark Dim — tmux 3.7+

# Status bar: normal.a = ends, normal.b = current window, normal.c = rest.
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#333b50,fg=#b0b5c1"
set -g status-left-style none
set -g status-right-style none
set -g status-left-length 16
set -g status-right-length 32
set -g status-left "#[fg=#333b50,bg=#7196d6,bold] #S #[fg=#7196d6,bg=#333b50,nobold]"
set -g status-right "#[fg=#7196d6,bg=#333b50,nobold]#[fg=#333b50,bg=#7196d6,bold] %Y-%m-%d %H:%M "
setw -g window-status-style "fg=#b0b5c1,bg=#333b50,none"
setw -g window-status-current-style "fg=#7196d6,bg=#272c3b,none"
setw -g window-status-separator " "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#333b50,bg=#272c3b] #[fg=#7196d6]#I #W #[fg=#272c3b,bg=#333b50]"

# Messages, selection, search, and navigation.
set -g message-style "fg=#b0b5c1,bg=#2d3244,fill=#2d3244"
set -g message-command-style "fg=#b0b5c1,bg=#2d3244,fill=#2d3244"
setw -g mode-style "fg=#b0b5c1,bg=#333b50"
setw -g copy-mode-match-style "fg=#202635,bg=#a7bf63"
setw -g copy-mode-current-match-style "fg=#202635,bg=#c49a68"
setw -g copy-mode-mark-style "fg=#202635,bg=#69b3bf"

# Synchronize-panes takes priority over copy mode: red / yellow / blue.
setw -g pane-border-style "fg=#3a4156"
setw -g pane-active-border-style "#{?synchronize-panes,fg=#cd7082,#{?pane_in_mode,fg=#c5a567,fg=#7196d6}}"
set -g display-panes-colour "#6e768e"
set -g display-panes-active-colour "#7196d6"

# Menus and popups.
set -g menu-style "fg=#b0b5c1,bg=#2d3244"
set -g menu-selected-style "fg=#7196d6,bg=#333b50"
set -g menu-border-style "fg=#3a4156,bg=#2d3244"
set -g popup-style "fg=#b0b5c1,bg=#2d3244"
set -g popup-border-style "fg=#3a4156,bg=#2d3244"
