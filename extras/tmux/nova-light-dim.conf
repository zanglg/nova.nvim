# Generated by scripts/generate_themes.lua; do not edit.
# Nova Light Dim — tmux 3.7+

# Status bar: normal.a = ends, normal.b = current window, normal.c = rest.
set -g status-style "bg=#d3d3d5,fg=#3d3e45"
set -g status-left-style none
set -g status-right-style none
set -g status-left "#[fg=#d3d3d5,bg=#2d69ae,bold] #S #[fg=#2d69ae,bg=#d3d3d5,nobold]"
set -g status-right "#[fg=#2d69ae,bg=#d3d3d5,nobold]#[fg=#d3d3d5,bg=#2d69ae,bold] %Y-%m-%d %H:%M "
setw -g window-status-style "fg=#3d3e45,bg=#d3d3d5,none"
setw -g window-status-current-style "fg=#2d69ae,bg=#ebecec,none"
setw -g window-status-separator " "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#d3d3d5,bg=#ebecec] #[fg=#2d69ae]#I #W #[fg=#ebecec,bg=#d3d3d5]"

# Messages, selection, search, and navigation.
set -g message-style "fg=#3d3e45,bg=#e0e0e2,fill=#e0e0e2"
set -g message-command-style "fg=#3d3e45,bg=#e0e0e2,fill=#e0e0e2"
setw -g mode-style "fg=#3d3e45,bg=#d3d3d5"
setw -g copy-mode-match-style "fg=#f4f5f5,bg=#5d6c32"
setw -g copy-mode-current-match-style "fg=#f4f5f5,bg=#876136"
setw -g copy-mode-mark-style "fg=#f4f5f5,bg=#366f78"

# Synchronize-panes takes priority over copy mode: red / yellow / blue.
setw -g pane-border-style "fg=#c6c7c9"
setw -g pane-active-border-style "#{?synchronize-panes,fg=#b64357,#{?pane_in_mode,fg=#a78e44,fg=#2d69ae}}"
set -g display-panes-colour "#95969d"
set -g display-panes-active-colour "#2d69ae"

# Menus and popups.
set -g menu-style "fg=#3d3e45,bg=#e0e0e2"
set -g menu-selected-style "fg=#2d69ae,bg=#d3d3d5"
set -g menu-border-style "fg=#c6c7c9,bg=#e0e0e2"
set -g popup-style "fg=#3d3e45,bg=#e0e0e2"
set -g popup-border-style "fg=#c6c7c9,bg=#e0e0e2"
