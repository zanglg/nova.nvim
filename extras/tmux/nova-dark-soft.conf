# Generated by scripts/generate_themes.lua; do not edit.
# Nova Dark Soft — tmux 3.7+

# Status bar: normal.a = ends, normal.b = current window, normal.c = rest.
set -g status-style "bg=#3b404f,fg=#abafba"
set -g status-left-style none
set -g status-right-style none
set -g status-left "#[fg=#3b404f,bg=#7998c3,bold] #S #[fg=#7998c3,bg=#3b404f,nobold]"
set -g status-right "#[fg=#7998c3,bg=#3b404f,nobold]#[fg=#3b404f,bg=#7998c3,bold] %Y-%m-%d %H:%M "
setw -g window-status-style "fg=#abafba,bg=#3b404f,none"
setw -g window-status-current-style "fg=#7998c3,bg=#2c303c,none"
setw -g window-status-separator " "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#3b404f,bg=#2c303c] #[fg=#7998c3]#I #W #[fg=#2c303c,bg=#3b404f]"

# Messages, selection, search, and navigation.
set -g message-style "fg=#abafba,bg=#323643,fill=#323643"
set -g message-command-style "fg=#abafba,bg=#323643,fill=#323643"
setw -g mode-style "fg=#abafba,bg=#3b404f"
setw -g copy-mode-match-style "fg=#272a35,bg=#9caf6a"
setw -g copy-mode-current-match-style "fg=#272a35,bg=#b4946e"
setw -g copy-mode-mark-style "fg=#272a35,bg=#70a9b2"

# Synchronize-panes takes priority over copy mode: red / yellow / blue.
setw -g pane-border-style "fg=#414758"
setw -g pane-active-border-style "#{?synchronize-panes,fg=#c1818b,#{?pane_in_mode,fg=#b39b6b,fg=#7998c3}}"
set -g display-panes-colour "#707789"
set -g display-panes-active-colour "#7998c3"

# Menus and popups.
set -g menu-style "fg=#abafba,bg=#323643"
set -g menu-selected-style "fg=#7998c3,bg=#3b404f"
set -g menu-border-style "fg=#414758,bg=#323643"
set -g popup-style "fg=#abafba,bg=#323643"
set -g popup-border-style "fg=#414758,bg=#323643"
